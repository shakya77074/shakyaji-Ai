name: Auto Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project Archive
        run: |
          unzip -o "*.zip"
          if [ ! -f "package.json" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "package.json" -printf "%h\n" | head -n 1)
            if [ -n "$SUBDIR" ] && [ "$SUBDIR" != "." ]; then
              cp -r "$SUBDIR"/* .
            fi
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Switch Redirect Login to In-App Popup
        run: |
          find . -maxdepth 3 -not -path '*/node_modules/*' -type f \( -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" \) -exec sed -i 's/signInWithRedirect/signInWithPopup/g' {} +

      - name: Build Web App
        run: npm run build

      - name: Configure and Add Android Platform
        run: |
          rm -f capacitor.config.ts capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.shakya.aistudio",
            "appName": "Shakya AI Studio",
            "webDir": "dist",
            "overrideUserAgent": "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36",
            "server": {
              "allowNavigation": [
                "*.firebaseapp.com",
                "*.google.com",
                "accounts.google.com",
                "*.googleapis.com"
              ]
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Enable In-App Popup Window in Android
        run: |
          cat << 'EOF' > android/app/src/main/java/com/shakya/aistudio/MainActivity.java
          package com.shakya.aistudio;

          import android.app.Dialog;
          import android.os.Message;
          import android.view.ViewGroup;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onStart() {
                  super.onStart();
                  WebView mainWebView = getBridge().getWebView();
                  WebSettings mainSettings = mainWebView.getSettings();
                  mainSettings.setSupportMultipleWindows(true);
                  mainSettings.setJavaScriptCanOpenWindowsAutomatically(true);

                  mainWebView.setWebChromeClient(new BridgeWebChromeClient(getBridge()) {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          final Dialog dialog = new Dialog(MainActivity.this, android.R.style.Theme_DeviceDefault_NoActionBar);
                          final WebView popupWebView = new WebView(MainActivity.this);
                          WebSettings settings = popupWebView.getSettings();
                          settings.setJavaScriptEnabled(true);
                          settings.setDomStorageEnabled(true);
                          settings.setDatabaseEnabled(true);
                          settings.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36");

                          popupWebView.setWebViewClient(new WebViewClient());
                          popupWebView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onCloseWindow(WebView window) {
                                  if (dialog.isShowing()) {
                                      dialog.dismiss();
                                  }
                                  window.destroy();
                              }
                          });

                          dialog.setContentView(popupWebView, new ViewGroup.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.MATCH_PARENT
                          ));
                          dialog.show();

                          WebView.WebViewTransport transport = (WebView.WebViewTransport) resultMsg.obj;
                          transport.setWebView(popupWebView);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });
              }
          }
          EOF

      - name: Fix Kotlin Duplicate Class Conflict
        run: |
          if [ -f "android/build.gradle" ]; then
            cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
              }
          }
          EOF
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shakya-AI-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
